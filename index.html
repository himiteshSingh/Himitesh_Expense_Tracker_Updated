<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Himitesh Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>💰 Himitesh Expense Tracker</h1>
        <p class="subtitle">Manage your daily expenses easily</p>

        <div class="summary">
            <div class="card">
                <h3>Total Expense</h3>
                <h2 id="totalExpense">₹0</h2>
            </div>

            <div class="card">
                <h3>Number of Expenses</h3>
                <h2 id="expenseCount">0</h2>
            </div>
        </div>

        <div class="expense-form">
            <h2>Add Expense</h2>

            <input type="text" id="expenseName" placeholder="Expense name">
            <input type="number" id="expenseAmount" placeholder="Amount ₹">

            <select id="expenseCategory">
                <option value="">Select Category</option>
                <option>Food</option>
                <option>Travel</option>
                <option>Shopping</option>
                <option>Education</option>
                <option>Bills</option>
                <option>Other</option>
            </select>

            <input type="date" id="expenseDate">

            <button onclick="addExpense()">Add Expense</button>
        </div>

        <div class="charts">
            <div class="chart-card">
                <h2>Expense by Category</h2>
                <canvas id="pieChart"></canvas>
            </div>

            <div class="chart-card">
                <h2>Category Comparison</h2>
                <canvas id="barChart"></canvas>
            </div>
        </div>

        <div class="expense-list">
            <h2>Recent Expenses</h2>

            <div id="expenseContainer">
                <p class="empty">No expenses added yet.</p>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>

</body>
</html>
